spring:
  servlet:
    multipart:
      max-file-size: 50MB
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/planetrush?serverTimezone=UTC&useUnicode=yes&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    # Spec 005 — verification_record 의 generated column + unique constraint 는
    # `VerificationRecordSchemaInitializer`(ApplicationRunner 패턴) 가 부팅 시 적용한다.
    # schema.sql 방식은 stored procedure 본문의 `;` 가 Spring ScriptUtils 의 단순 split
    # 과 충돌해 회귀를 일으켰음(phase2-verify.md 참조).

logging:
  level:
    org:
      springframework:
        web: DEBUG
    com:
      example: DEBUG

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  issuer: ${JWT_ISSUER}
  salt: ${JWT_SALT}
  access-token:
    expiretime: ${JWT_ACCESS_TOKEN_EXPIRETIME}
  refresh-token:
    expiretime: ${JWT_REFRESH_TOKEN_EXPIRETIME}

kakao:
  secret:
    key: ${KAKAO_SECRET_KEY}
  loginurl: ${KAKAO_LOGIN_URL}
  logouturl: ${KAKAO_LOGOUT_URL}

cloud:
  aws:
    credentials:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
    region:
      static: ${AWS_S3_BUCKET_REGION}
    stack:
      auto: false
    s3:
      bucket: ${AWS_S3_BUCKET_NAME}

flask:
  verifyurl: ${FLASK_VERIFY_URL}
  progressavgurl: ${FLASK_PROGRESS_AVG_URL}

notification:
  mattermost:
    enabled: false # mmSender를 사용할 지 여부, false면 알림이 오지 않는다
    webhook-url: ${MATTERMOST_WEBHOOK_URL} # 위의 Webhook URL을 기입
    color: ${MATTERMOST_COLOR} # attachment에 왼쪽 사이드 컬러. default=red
    author-name: ${MATTERMOST_AUTHOR_NAME} # attachment의 상단에 나오는 이름
    author-icon: ${MATTERMOST_AUTHOR_ICON} # author-icon 왼쪽에 나올 아이콘의 url링크
    footer: # attachment에 하단에 나올 부분. default=현재 시간

scheduled-task:
  change-planet-status-cron: 0 0 0 * * ?
  ban-if-last-verification-older-than-three-days: 0 5 0 * * ?
  planet-complete-destroy: 0 10 0 * * ?

verification:
  publisher:
    type: redis-stream  # http -> RestClient를 사용한 api 호출
  redis:
    stream-key: verify:requests   # Spec 005 — 컨슈머 계약 정합
  # Spec 005 — 테스트는 callback 을 MockMvc/RestClient 로 직접 호출하므로 dummy URL.
  callback-url: http://localhost:0/internal-test-only
  threshold: "0.088"

outbox:
  republisher:
    enabled: false  # Spec 002 FR-006 — 통합 테스트는 폴러를 직접 호출해 결정론적으로 검증
